services:
  api:
    build:
      context: .
      dockerfile: src/Sehati.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: ${SEHATI_DB_CONNECTION:?Set SEHATI_DB_CONNECTION}
      JwtSettings__Secret: ${SEHATI_JWT_SECRET:?Set SEHATI_JWT_SECRET}
      CorsSettings__AllowedOrigins__0: ${SEHATI_PUBLIC_ORIGIN:?Set SEHATI_PUBLIC_ORIGIN}
      RateLimiting__Disabled: "false"
    restart: unless-stopped

  web:
    build:
      context: src/Sehati.Web
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "${SEHATI_HTTP_PORT:-8080}:80"
    restart: unless-stopped
